<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>NAVEX NDS</title>
  <link rel="stylesheet" href="https://cdn.maptiler.com/maptiler-sdk-js/v3.9.0/maptiler-sdk.css" />
  <link rel="stylesheet" href="styles.css?v=20260925d" />
</head>
<body>
  <header class="topbar">
    <div class="brand"><h1>NAVEX NDS</h1><span>Route planner</span></div>
    <nav class="top-actions">
      <button id="importBtn" class="ghost" title="Import checkpoints and a route from a file">Import</button>
      <button id="exportBtn" class="ghost" title="Export all checkpoints, the route and the NDS to a file">Export</button>
      <button id="printBtn" class="ghost" title="Print the navigational data sheet">Print</button>
      <button id="mapKeyBtn" class="ghost icon" title="MapTiler API key" aria-label="MapTiler API key">⚙</button>
    </nav>
  </header>

  <div class="app">
    <aside class="panel">
      <section class="block">
        <div class="block-head"><h2>Checkpoints <span id="cpCount" class="count"></span></h2></div>
        <form id="cpForm" class="cp-form" autocomplete="off">
          <select id="cpType" aria-label="Checkpoint type"><option value="CP">CP</option><option value="SCP">SCP</option></select>
          <input id="cpMgr" inputmode="numeric" maxlength="9" placeholder="MGR e.g. 2846 5132" aria-label="Checkpoint MGR" required>
          <input id="cpId" maxlength="12" placeholder="ID (optional, auto-numbered)" aria-label="Checkpoint ID">
          <button type="submit" class="primary">Add</button>
        </form>
        <small id="cpStatus" class="status"></small>
        <div id="checkpointList" class="cp-list"></div>
      </section>

      <section class="block route-block">
        <div class="block-head">
          <h2>Route</h2>
          <div class="head-actions">
            <button id="undoBtn" class="small">Undo</button>
            <button id="clearBtn" class="small">Clear</button>
          </div>
        </div>
        <p id="routeSummary" class="summary"></p>
        <div id="routeList"></div>
      </section>
    </aside>

    <main class="map-wrap">
      <div id="map"></div>
      <div class="map-style" role="group" aria-label="Map style">
        <button data-style="topo" class="active">Topo</button>
        <button data-style="satellite">Satellite</button>
      </div>
      <p id="mapHint" class="map-hint">Tap a checkpoint to start the route · then tap the map to add waypoints</p>
    </main>
  </div>

  <section id="printSheet" class="print-sheet"></section>

  <dialog id="apiKeyDialog">
    <form id="apiKeyForm">
      <h3>MapTiler API key</h3>
      <p class="dialog-help">The map needs a MapTiler Cloud API key. It is stored only in this browser.</p>
      <label>API key<input id="apiKeyInput" type="password" autocomplete="off" spellcheck="false" placeholder="Paste your MapTiler API key"></label>
      <div id="apiKeyStatus" class="dialog-status"></div>
      <div class="dialog-actions">
        <button id="apiKeyCancelBtn" type="button">Cancel</button>
        <button type="submit" class="primary">Save &amp; load map</button>
      </div>
    </form>
  </dialog>

  <input id="importFile" type="file" accept=".json,application/json" hidden>

  <script src="https://cdn.maptiler.com/maptiler-sdk-js/v3.9.0/maptiler-sdk.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.15.0/proj4.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.6/Sortable.min.js"></script>
  <script src="grid.js?v=20260925d"></script>
  <script src="share.js?v=20260925d"></script>
  <script src="app.js?v=20260925d"></script>
</body>
</html>
