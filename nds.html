<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NAVEX Navigational Data Sheet</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="nds-page">
  <header class="topbar">
    <div>
      <h1>NAVEX NDS</h1>
      <p>Navigational Data Sheet</p>
    </div>
    <div class="top-actions">
      <a class="nav-btn secondary" href="index.html">Plot Route</a>
      <button id="exportCsvBtn" class="secondary">Export CSV</button>
      <button id="printBtn" class="primary">Print / PDF</button>
    </div>
  </header>

  <main class="nds-main">
    <section class="nds-toolbar panel">
      <div>
        <h2>Navigational Data Sheet</h2>
        <span id="routeSummary">0 legs · 0 m · 0:00</span>
      </div>
      <div class="nds-settings">
        <label>Speed<input id="speed" type="number" min="0.1" step="0.1" value="4.0"><span>km/h</span></label>
        <label>Distance<select id="distanceUnit"><option value="m">metres</option><option value="km">kilometres</option></select></label>
        <label>MGR<select id="mgrPrecision"><option value="4">4-digit</option><option value="6">6-digit</option></select></label>
      </div>
    </section>

    <section class="panel nds-table-panel">
      <div class="table-wrap">
        <table id="ndsTable">
          <thead><tr>
            <th>No.</th><th>From MGR</th><th>To MGR</th><th>Azimuth</th><th>Distance</th><th>Est. Time</th><th>Description</th><th>Remarks</th><th></th>
          </tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </main>
  <script src="nds.js"></script>
</body>
</html>
